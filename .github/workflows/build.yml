name: Build

# Baut die Tauri-Desktop-App inkl. des PyInstaller-Sidecars für die Engine
# (siehe CLAUDE.md Architekturentscheidung #2/#6: Cross-Platform von Anfang
# an, macOS + Windows, je eigener Runner). Der Sidecar-Build läuft nicht
# als eigener Schritt hier, sondern automatisch über
# tauri.conf.json:beforeBuildCommand -> packaging/prepare_sidecar.mjs ->
# packaging/build_sidecar.py, exakt derselbe Weg wie bei einem lokalen
# `npm run tauri build` - es gibt keinen zweiten, CI-spezifischen
# Build-Pfad, der auseinanderlaufen könnte.
#
# Windows-Teil ist UNGETESTET (kein Windows-Runner beim Erstellen dieses
# Workflows verfügbar) - insbesondere die Tesseract-Installation per
# Chocolatey und das DLL-Layout in packaging/build_sidecar.py
# (_stage_tesseract_windows) sollten beim ersten echten CI-Lauf geprüft
# und ggf. nachgebessert werden.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target-triple: aarch64-apple-darwin
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # WARNUNG AUSSCHALTEN:
      # he following taps are not trusted:
      #    aws/tap
      # Homebrew is currently ignoring formulae, casks and commands from these taps because tap trust is required.
      # HINWEIS VON CLAUDE:
      # Die Warnung ist harmlos und blockiert deinen Build nicht. Wenn du sie trotzdem loswerden willst, 
      # füge in der build.yml vor dem Tesseract-Install-Step einen neuen Step ein:
      - name: Remove untrusted Homebrew taps
              if: runner.os == 'macOS'
              run: brew untap aws/tap

      # macOS: Tesseract + Sprachmodell (deu) + dylibbundler für die
      # Relozierung der Homebrew-Abhängigkeiten (siehe
      # packaging/build_sidecar.py:_stage_tesseract_macos).
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang dylibbundler

      # Windows: UNGETESTET, siehe Kommentar oben. choco-Paket "tesseract"
      # bringt ggf. nicht automatisch das deu-Sprachmodell mit - dann hier
      # zusätzlich deu.traineddata von
      # https://github.com/tesseract-ocr/tessdata herunterladen und ins
      # tessdata-Verzeichnis der Installation legen.
      #
      # choco schreibt sein Installationsverzeichnis zwar in den
      # Maschinen-PATH, aber ein GitHub-Actions-Job liest die Umgebung nur
      # einmal zu Job-Start ein - PATH-Änderungen, die WÄHREND des Jobs
      # passieren, sieht kein späterer Step (siehe Fund aus dem ersten
      # Windows-Lauf: TesseractNotFoundError im pytest-Step trotz
      # erfolgreicher choco-Installation). Deshalb hier explizit prüfen, wo
      # tesseract.exe tatsächlich gelandet ist, und das Verzeichnis über
      # GITHUB_PATH an alle nachfolgenden Steps weiterreichen.
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 'Continue' statt des pwsh-Defaults 'Stop': choco kann mit
          # Exit-Code 3010 (Neustart ausstehend) enden, was pwsh sonst -
          # abhängig von $PSNativeCommandUseErrorActionPreference - als
          # terminierenden Fehler werten und die eigene Exit-Code-Prüfung
          # unten nie erreichen lassen würde (dieselbe Fehlerklasse wie im
          # Diagnose-Step, siehe dort).
          $ErrorActionPreference = 'Continue'

          choco install tesseract --version=5.3.3.20231005 -y
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0 -and $exitCode -ne 3010) {
            Write-Error "choco install tesseract fehlgeschlagen (Exit-Code $exitCode)."
            exit 1
          }
          Write-Host "choco install tesseract erfolgreich (Exit-Code $exitCode, 3010 = Neustart ausstehend)."

          $candidates = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\ProgramData\chocolatey\lib\tesseract",
            "C:\ProgramData\chocolatey\bin"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "Kandidat vorhanden: $c"
            } else {
              Write-Host "Kandidat nicht vorhanden: $c"
            }
          }

          $tesseractExe = Get-ChildItem -Path $candidates -Recurse -Filter "tesseract.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tesseractExe) {
            Write-Error "tesseract.exe wurde in keinem der bekannten Installationsverzeichnisse gefunden."
            exit 1
          }
          $tesseractDir = $tesseractExe.DirectoryName
          Write-Host "tesseract.exe gefunden unter: $($tesseractExe.FullName)"
          Write-Host "Fuege PATH fuer nachfolgende Steps hinzu: $tesseractDir"
          Add-Content -Path $env:GITHUB_PATH -Value $tesseractDir

      # Rein diagnostisch (siehe docs/windows-build-readiness.md, Risiken
      # 1+2): erfasst das tatsächliche choco-Tesseract-Layout, BEVOR der
      # Build laufen kann - damit diese Daten auch dann im Log stehen, wenn
      # der spätere Sidecar-Build wegen genau dieser Annahmen fehlschlägt.
      # continue-on-error, weil ein Diagnose-Schritt den Build nicht rot
      # machen soll, egal was er vorfindet.
      - name: Diagnose Tesseract layout
        if: matrix.os == 'windows-latest'
        shell: pwsh
        continue-on-error: true
        run: |
          # $ErrorActionPreference = 'Stop' ist pwsh-Default unter GitHub
          # Actions - eine einzelne fehlschlagende/fehlende Binary hätte
          # sonst das gesamte Diagnose-Skript abgebrochen (siehe Fund aus
          # dem ersten Windows-Lauf: "tesseract --version" schlug mit
          # CommandNotFoundException fehl, Abschnitte (b)-(f) liefen nie).
          # 'Continue' allein reicht nicht für CommandNotFoundException
          # (die wird unabhängig von $ErrorActionPreference als
          # Engine-Exception geworfen) - deshalb zusätzlich jeden nativen
          # Aufruf einzeln in try/catch kapseln. continue-on-error: true
          # bleibt als zweite Absicherung bestehen; exit 0 am Ende
          # verhindert zusätzlich, dass ein von der letzten nativen
          # Anweisung übrig gebliebener nicht-null $LASTEXITCODE den Step
          # fehlschlagen lässt.
          $ErrorActionPreference = 'Continue'

          Write-Host "=== (a) tesseract --version ==="
          try {
            tesseract --version
          } catch {
            Write-Host "tesseract --version fehlgeschlagen: $_"
          }
          Write-Host ""
          Write-Host "=== (a) tesseract --list-langs ==="
          try {
            tesseract --list-langs
          } catch {
            Write-Host "tesseract --list-langs fehlgeschlagen: $_"
          }

          Write-Host ""
          Write-Host "=== (b) where.exe tesseract ==="
          $hits = @()
          try {
            $hits = @((where.exe tesseract) -split "`r?`n" | Where-Object { $_ })
          } catch {
            Write-Host "where.exe tesseract fehlgeschlagen: $_"
          }
          if ($hits.Count -eq 0) {
            Write-Host "Keine Treffer fuer 'tesseract' im PATH."
          } else {
            $hits | ForEach-Object { Write-Host $_ }
          }

          Write-Host ""
          Write-Host "=== (c) Shim vs. real binary per hit ==="
          Write-Host "Hinweis: ein Chocolatey-Shim ist KEIN Symlink - Path.resolve() in Python"
          Write-Host "(siehe packaging/build_sidecar.py:_find_tessdata_deu) loest ihn NICHT auf."
          foreach ($hit in $hits) {
            Write-Host "-- $hit --"
            $shimFile = "$hit.shim"
            if (Test-Path $shimFile) {
              Write-Host "  -> Chocolatey-Shim (Begleitdatei gefunden: $shimFile)"
              Write-Host "  Shim-Inhalt (enthaelt den echten Zielpfad):"
              Get-Content $shimFile | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "  -> Keine .shim-Begleitdatei - vermutlich echte Binary."
              Write-Host "  Groesse: $((Get-Item $hit -ErrorAction SilentlyContinue).Length) Bytes"
            }
          }

          Write-Host ""
          Write-Host "=== (d) Rekursives Listing (max. Tiefe 3) der Tesseract-Installationswurzel ==="
          foreach ($root in @("C:\Program Files\Tesseract-OCR", "C:\ProgramData\chocolatey\lib\tesseract")) {
            if (Test-Path $root) {
              Write-Host "-- $root --"
              Get-ChildItem -Path $root -Recurse -Depth 3 |
                ForEach-Object { Write-Host "  $($_.FullName.Substring($root.Length + 1))" }
            } else {
              Write-Host "-- $root -- (existiert nicht)"
            }
          }

          Write-Host ""
          Write-Host "=== (e) Suche nach *.traineddata (insb. deu.traineddata) ==="
          $found = $false
          foreach ($root in @("C:\Program Files\Tesseract-OCR", "C:\ProgramData\chocolatey\lib\tesseract")) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Filter "*.traineddata" -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "  gefunden: $($_.FullName)"
                  if ($_.Name -eq "deu.traineddata") { $found = $true }
                }
            }
          }
          if ($found) {
            Write-Host "deu.traineddata: GEFUNDEN (siehe Pfad(e) oben)"
          } else {
            Write-Host "deu.traineddata: NICHT GEFUNDEN unter den durchsuchten Wurzeln"
          }

          Write-Host ""
          Write-Host "=== (f) TESSDATA_PREFIX ==="
          if ($env:TESSDATA_PREFIX) {
            Write-Host "TESSDATA_PREFIX=$env:TESSDATA_PREFIX"
          } else {
            Write-Host "TESSDATA_PREFIX ist nicht gesetzt."
          }

          exit 0

      - name: Install Python build dependencies
        run: |
          python -m venv .venv
          ${{ runner.os == 'Windows' && '.venv\Scripts\pip' || '.venv/bin/pip' }} install -e ".[build,test]"

      - name: Run Python tests
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python' || '.venv/bin/python' }} -m pytest -q

      - name: Install npm dependencies
        run: npm ci

      # Baut Frontend + Sidecar (via beforeBuildCommand) + Tauri-Bundle in
      # einem Schritt, siehe Kommentar oben.
      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: papertrail-compare-${{ matrix.target-triple }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error