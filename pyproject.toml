[project]
name = "papertrail-compare"
version = "0.1.0"
description = "Textlicher Vergleich von PDF-Dateien für Output-Management-Migrationen"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "pdfplumber",
    "pytesseract",
    "reportlab",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
lint = [
    "ruff",
    "mypy",
    "types-reportlab",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract"]
ignore_missing_imports = true
