[project]
name = "papertrail-compare"
version = "0.1.0"
description = "Textlicher Vergleich von PDF-Dateien für Output-Management-Migrationen"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "pdfplumber",
    "pytesseract",
    "diff-match-patch",
    "reportlab",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
